name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yourtab_ci
        run: pnpm --filter @vaultstream/database generate
      - name: Type-check workspaces
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yourtab_ci
        run: pnpm typecheck
      - name: Build workspaces
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yourtab_ci
        run: pnpm build
